<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Document</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1 id="title">Tom & Jerry Laberinth</h1>
    </header>
    <div id="main">
      <div id="cnv" style="display: none">
        <div class="game">
          <canvas id="marco" width="500" height="400"></canvas>
        </div>
        <div id="score">
          <div class="tit">
            <h3>High Score</h3>
          </div>
          <hr />
          <div class="stats">
            <p id="intentos">Pasos:</p>
            <p id="time">Time:</p>
            <br />
          </div>
        </div>
      </div>
      <div id="startScreen">
        <a class="stBut" href="#" onclick="startGame()">Start</a>
        <div class="controls"></div>
      </div>
      <div id="gameOver" style="display: none">
        <div class="content">
          <h1 id="meta"></h1>
          <a class="stBut" href="#" onclick="startGame()">Play again</a>
        </div>
        
      </div>
    </div>
    <footer>
      <h1><a href="https://github.com/AlexGa03">Alex_Garcia_Alvarez©Copyright</a></h1>
    </footer>
  </body>
</html>
